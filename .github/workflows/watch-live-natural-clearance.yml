name: Verify live SiteGround natural clearances #104
on:
  workflow_run:
    workflows: ["Deploy PokéFC Home + Three Game Modes"]
    types: [completed]
permissions:
  contents: read
jobs:
  siteground-natural-clearance:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ci-live-natural-clearance-104.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siteground-natural-clearance-104
          path: natural-clearance-live-proof/
          retention-days: 14
