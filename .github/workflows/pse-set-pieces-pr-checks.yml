name: PSE set-piece prototype checks
on:
  pull_request:
    branches: [main]
    paths:
      - "quick-sim.js"
      - "tests/test-pse-set-pieces.cjs"
      - ".github/workflows/pse-set-pieces-pr-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  set-piece-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and 500-match set-piece simulation
        run: |
          node --check quick-sim.js
          node tests/test-pse-set-pieces.cjs
      - name: Existing engine and report integrity
        run: |
          node tests/test-phase10-director.cjs
          node tests/test-challenge-player-shots.cjs
          node tests/test-play.cjs
          node tests/test-v08-league.cjs
