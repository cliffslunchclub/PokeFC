name: Challenge PR regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - "challenge/**"
      - "newtro.css"
      - "favicon.svg"
      - "site.css"
      - "index.html"
      - "play/index.html"
      - "franchise/index.html"
      - "ratings/index.html"
      - "tests/test-newtro-ui.cjs"
      - "tests/test-branding.cjs"
      - "tests/test-challenge-*.cjs"
      - "scripts/build-siteground.sh"
      - ".github/workflows/challenges-pr-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenge-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Poké Ball branding and UI contracts
        run: |
          node tests/test-branding.cjs
          node tests/test-newtro-ui.cjs
      - name: Check Challenge JavaScript
        run: |
          node --check challenge/picker-window.js
          node --check challenge/drag-drop.js
          node --check challenge/performance.js
          node --check challenge/item-optimizer.js
          node --check challenge/run-card.js
      - name: Run Challenge regressions
        run: |
          for file in tests/test-challenge-*.cjs; do
            echo "Testing $file"
            node "$file"
          done
      - name: Verify watched-match bridge and continuation
        run: |
          node --check play/play.js
          node --check tm-engine-bridge.js
          node --check tm-worker.js
          node --check hybrid-sim.js
          node tests/test-tm-worker.cjs
          node tests/test-tm-bridge.cjs
          node tests/test-tm-handoff.cjs
          node tests/test-hybrid.cjs
          node tests/test-play.cjs
      - name: Validate build packaging
        run: bash scripts/build-siteground.sh
