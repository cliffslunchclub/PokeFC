name: PokéFC enclosed pitch regressions
on:
  pull_request:
    branches: [main]
    paths:
      - "assets/js/quick-sim.js"
      - "tests/test-pse-enclosed-pitch.cjs"
      - ".github/workflows/pse-enclosed-pitch-pr-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enclosed-pitch-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and 500-match no-whistle simulation
        run: |
          node --check assets/js/quick-sim.js
          node tests/test-pse-enclosed-pitch.cjs
      - name: Existing engine and report integrity
        run: |
          node tests/test-phase10-director.cjs
          node tests/test-challenge-player-shots.cjs
          node tests/test-play.cjs
          node tests/test-v08-league.cjs
