name: Watch continuous official buildup reproduction
on:
  pull_request:
    paths:
      - 'watch/soccerjs/phase10-motion.cjs'
      - 'watch/soccerjs/phase10-goal-sequence.cjs'
      - 'watch/soccerjs/phase10-save-sequence.cjs'
      - 'watch/soccerjs/highlight-replay.cjs'
      - 'watch/soccerjs/test-incident-reproduction.cjs'
      - 'watch/soccerjs/repros/**'
      - 'tests/ci-buildup-before-after-video.cjs'
      - '.github/workflows/watch-continuous-buildup.yml'
permissions:
  contents: read
jobs:
  reproducible-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node watch/soccerjs/test-incident-reproduction.cjs
  matching-videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: current
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: b35178b8d8913218f40089d900b9d04b5c0f48e6
          path: baseline
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: cd baseline && bash watch/soccerjs/build-local.sh
      - run: cd current && bash watch/soccerjs/build-local.sh
      - run: cd current && npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: cd current && npx playwright install --with-deps chromium
      - run: node current/tests/ci-buildup-before-after-video.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-buildup-before-after
          path: buildup-proof/
          retention-days: 14
