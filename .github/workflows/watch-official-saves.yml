name: Watch official saves and restart verification
on:
  pull_request:
    branches: [main, 'feature/official-saves-restarts-recovery']
    paths: ['assets/js/quick-sim.js', 'assets/js/pse-knockout.js', 'watch/soccerjs/**', 'tests/**', '.github/workflows/watch-official-saves.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watch-saves-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tests/test-pse-extra-time-cap.cjs
      - run: node tests/test-pse-incident-spacing.cjs
      - run: node watch/soccerjs/test-followup-guardrails.cjs
      - run: node watch/soccerjs/test-onside-movement.cjs
      - run: node watch/soccerjs/test-official-saves-restarts.cjs
      - run: node watch/soccerjs/test-kickoff-intro.cjs
      - run: node watch/soccerjs/test-one-on-one.cjs
      - run: node watch/soccerjs/test-shot-retreat.cjs
      - run: node watch/soccerjs/test-defensive-recovery.cjs
      - run: node watch/soccerjs/test-clearance-priority.cjs
      - run: node tests/test-watch-highlights.cjs
      - run: node tests/test-pse-watch-events.cjs
      - run: node tests/test-quick-seed-compat.cjs
      - run: node tests/test-calibration.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: bash watch/soccerjs/build-local.sh
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ci-official-saves-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-save-browser-proof
          path: pse-browser-artifacts/
          retention-days: 7
