name: Watch pitch zoom controls
on:
  pull_request:
    paths:
      - 'watch/soccerjs/viewer-entry.cjs'
      - 'watch/soccerjs/index.html'
      - 'watch/soccerjs/viewer.css'
      - 'watch/soccerjs/phase10-camera-zoom.cjs'
      - 'watch/soccerjs/test-camera-zoom.cjs'
      - '.github/workflows/watch-pitch-zoom.yml'
  push:
    branches: [main]
    paths:
      - 'watch/soccerjs/viewer-entry.cjs'
      - 'watch/soccerjs/index.html'
      - 'watch/soccerjs/viewer.css'
      - 'watch/soccerjs/phase10-camera-zoom.cjs'
      - '.github/workflows/watch-pitch-zoom.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check watch/soccerjs/viewer-entry.cjs
      - run: node --check watch/soccerjs/phase10-camera-zoom.cjs
      - run: node watch/soccerjs/test-camera-zoom.cjs
      - run: node watch/soccerjs/test-player-pace.cjs
      - run: node watch/soccerjs/test-possession-continuity.cjs
      - run: node watch/soccerjs/test-goal-kickoff-reset.cjs
