name: Deploy PokéFC Home + Three Game Modes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.svg"
      - "ratings/**"
      - ".htaccess"
      - "builder.css"
      - "builder.js"
      - "site.css"
      - "national-species.js"
      - "play/**"
      - "challenge/**"
      - "franchise/**"
      - "career.css"
      - "career.js"
      - "species.js"
      - "quick-sim.js"
      - "calibration-profile.js"
      - "hybrid-sim.js"
      - "tm-engine-bridge.js"
      - "tactical-viewer.js"
      - "tm-worker.js"
      - "tacticmesh/vendor/**"
      - "scripts/build-siteground.sh"
      - "tests/test-national-dex.cjs"
      - "tests/test-free-builder.cjs"
      - "tests/test-branding.cjs"
      - "tests/test-play.cjs"
      - "tests/test-challenge-play.cjs"
      - "tests/test-challenge-gauntlet.cjs"
      - "tests/test-challenge-special-items.cjs"
      - "tests/test-v08-league.cjs"
      - "tests/test-hybrid.cjs"
      - ".github/workflows/deploy-siteground.yml"

permissions:
  contents: read

concurrency:
  group: pfc-siteground-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish pfc.cliffslunchclub.com
    runs-on: ubuntu-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v4

      - name: Test National Builder, Play, Challenges and Franchise
        run: |
          node --check builder.js
          node --check play/play.js
          node --check play/opponents.js
          node --check national-species.js
          node tests/test-national-dex.cjs
          node tests/test-play.cjs
          node tests/test-challenge-play.cjs
          node tests/test-challenge-gauntlet.cjs
          node tests/test-free-builder.cjs
          node tests/test-branding.cjs
          node tests/test-challenge-special-items.cjs
          node tests/test-v08-league.cjs
          node tests/test-hybrid.cjs

      - name: Build the public playtest
        run: bash scripts/build-siteground.sh

      - name: Validate public output
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html favicon.svg ratings/index.html site.css builder.js builder.css national-species.js quick-sim.js calibration-profile.js play/index.html play/play.css play/play.js play/opponents.js play/hybrid-sim.js play/tm-engine-bridge.js play/tm-worker.js play/tacticmesh/vendor/installed.json play/tacticmesh/vendor/LICENSE challenge/index.html challenge/special-items-data.js franchise/index.html franchise/career.js franchise/career.css franchise/hybrid-sim.js franchise/tm-engine-bridge.js franchise/tm-worker.js franchise/tactical-viewer.js franchise/tacticmesh/vendor/installed.json franchise/tacticmesh/vendor/LICENSE; do
            test -s "dist/$file"
          done
          test -s dist/.htaccess
          grep -q "private, no-cache, max-age=0, must-revalidate" dist/.htaccess
          test ! -e dist/.git
          test ! -e dist/legacy-v05
          test ! -e dist/legacy-v07c
          test ! -e dist/career.js
          test ! -e dist/tacticmesh/vendor
          test ! -e dist/calibration
          test ! -e dist/tests
          echo "All five pages validated: Home, Ratings guide and three modes (Play, Challenges, Franchise)."

      - name: Check deployment credentials
        id: ftp
        shell: bash
        env:
          HOST: ${{ secrets.SG_FTP_HOST }}
          USERNAME: ${{ secrets.SG_FTP_USER }}
          PASSWORD: ${{ secrets.SG_FTP_PASSWORD }}
        run: |
          if [[ -n "$HOST" && -n "$USERNAME" && -n "$PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add SG_FTP_HOST, SG_FTP_USER and SG_FTP_PASSWORD as Actions secrets to enable SiteGround publishing."
          fi

      # FTP home must be the pfc subdomain folder, one level above public_html.
      # Publishing is restricted to public_html within that dedicated subdomain.
      # Explicit FTPS + certificate validation: never silently use plain FTP.
      - name: Deploy to pfc.cliffslunchclub.com
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SG_FTP_HOST }}
          username: ${{ secrets.SG_FTP_USER }}
          password: ${{ secrets.SG_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
          log-level: standard
