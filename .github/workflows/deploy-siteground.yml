name: Deploy PokéFC Home + Three Game Modes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.svg"
      - "ratings/**"
      - ".htaccess"
      - "builder.css"
      - "builder.js"
      - "site.css"
      - "national-species.js"
      - "play/**"
      - "watch/**"
      - "match-director/**"
      - "challenge/**"
      - "franchise/**"
      - "career.css"
      - "career.js"
      - "species.js"
      - "quick-sim.js"
      - "calibration-profile.js"
      - "hybrid-sim.js"
      - "tm-engine-bridge.js"
      - "tactical-viewer.js"
      - "tm-worker.js"
      - "tacticmesh/vendor/**"
      - "scripts/build-siteground.sh"
      - "tests/test-national-dex.cjs"
      - "tests/test-free-builder.cjs"
      - "tests/test-branding.cjs"
      - "tests/test-play.cjs"
      - "tests/test-phase10-quickplay-lifecycle.cjs"
      - "tests/test-phase10-director.cjs"
      - "tests/test-soccerjs-sprite-loading.cjs"
      - "tests/test-challenge-play.cjs"
      - "tests/test-challenge-gauntlet.cjs"
      - "tests/test-challenge-ui.cjs"
      - "tests/test-challenge-completed-run.cjs"
      - "tests/test-challenge-leaderboard.cjs"
      - "tests/test-challenge-run-card.cjs"
      - "tests/test-challenge-v1-flow.cjs"
      - "tests/test-challenge-striker-first.cjs"
      - "tests/test-challenge-watch-v1.cjs"
      - "tests/test-challenge-slot-reels.cjs"
      - "tests/test-challenge-unique-rerolls.cjs"
      - "tests/test-challenge-tier-positions.cjs"
      - "tests/test-challenge-special-items.cjs"
      - "tests/test-challenge-primal-items.cjs"
      - "tests/test-challenge-match-report.cjs"
      - "tests/test-challenge-drag-drop.cjs"
      - "tests/test-challenge-penalties.cjs"
      - "tests/test-challenge-performance.cjs"
      - "tests/test-challenge-item-optimizer.cjs"
      - "tests/test-challenge-auto-equip.cjs"
      - "tests/test-challenge-player-shots.cjs"
      - "tests/test-challenge-modals.cjs"
      - "tests/test-v08-league.cjs"
      - "tests/test-hybrid.cjs"
      - ".github/workflows/deploy-siteground.yml"

permissions:
  contents: read

concurrency:
  group: pfc-siteground-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish pfc.cliffslunchclub.com
    runs-on: ubuntu-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v4

      - name: Test National Builder, Play, Challenges and Franchise
        run: |
          node --check builder.js
          node --check play/play.js
          node --check play/opponents.js
          node --check national-species.js
          node --check challenge/leaderboard.js
          node --check challenge/run-card.js
          node --check challenge/slot-reels.js
          node --check challenge/tiers.js
          node --check challenge/match-report.js
          node --check challenge/drag-drop.js
          node --check challenge/performance.js
          node --check challenge/item-optimizer.js
          node tests/test-national-dex.cjs
          node tests/test-play.cjs
          node tests/test-phase10-quickplay-lifecycle.cjs
          node watch/soccerjs/test-inline-bridge.cjs
          node tests/test-soccerjs-sprite-loading.cjs
          node --check watch/soccerjs/viewer-entry.cjs
          node --check watch/soccerjs/watch-bridge.js
          node tests/test-challenge-play.cjs
          node tests/test-challenge-gauntlet.cjs
          node tests/test-challenge-ui.cjs
          node tests/test-challenge-completed-run.cjs
          node tests/test-challenge-leaderboard.cjs
          node tests/test-challenge-run-card.cjs
          node tests/test-challenge-v1-flow.cjs
          node tests/test-challenge-striker-first.cjs
          node tests/test-challenge-watch-v1.cjs
          node tests/test-challenge-slot-reels.cjs
          node tests/test-challenge-unique-rerolls.cjs
          node tests/test-challenge-tier-positions.cjs
          node tests/test-free-builder.cjs
          node tests/test-branding.cjs
          node tests/test-challenge-special-items.cjs
          node tests/test-challenge-primal-items.cjs
          node tests/test-challenge-match-report.cjs
          node tests/test-challenge-drag-drop.cjs
          node tests/test-challenge-penalties.cjs
          node tests/test-challenge-performance.cjs
          node tests/test-challenge-item-optimizer.cjs
          node tests/test-challenge-auto-equip.cjs
          node tests/test-challenge-player-shots.cjs
          node tests/test-challenge-modals.cjs
          node tests/test-v08-league.cjs
          node tests/test-hybrid.cjs

      - name: Check out pinned Soccer-JS native renderer
        uses: actions/checkout@v4
        with:
          repository: haeretici/soccer-js
          ref: 38970e0dade0865078c9e84bc1ecfd72aaa02fde
          path: soccer-js-upstream
          persist-credentials: false

      - name: Compile native Soccer-JS 2.5D for opt-in Watch
        shell: bash
        run: |
          set -euo pipefail
          (cd soccer-js-upstream && npm install --no-audit --no-fund)
          cp watch/soccerjs/viewer-entry.cjs soccer-js-upstream/pfc-viewer-entry.cjs
          cp watch/soccerjs/phase10-motion.cjs soccer-js-upstream/
          cp watch/soccerjs/pokemon-*.cjs soccer-js-upstream/
          mkdir -p watch/soccerjs/dist
          ./soccer-js-upstream/node_modules/.bin/esbuild soccer-js-upstream/pfc-viewer-entry.cjs \
            --bundle --platform=browser --format=iife --target=es2020 \
            --minify --outfile=watch/soccerjs/dist/viewer.bundle.js
          cp watch/soccerjs/index.html watch/soccerjs/viewer.css watch/soccerjs/dist/
          cp -R soccer-js-upstream/presets soccer-js-upstream/assets watch/soccerjs/dist/
          cp soccer-js-upstream/LICENSE watch/soccerjs/dist/SOCCER-JS-LICENSE.txt
          test -s watch/soccerjs/dist/viewer.bundle.js

      - name: Build the public playtest (2.5D opt-in only)
        run: PFC_INCLUDE_SOCCERJS=1 bash scripts/build-siteground.sh

      - name: Validate public output
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html favicon.svg ratings/index.html site.css builder.js builder.css national-species.js quick-sim.js calibration-profile.js play/index.html play/play.css play/play.js play/opponents.js play/hybrid-sim.js play/tm-engine-bridge.js play/tm-worker.js play/tacticmesh/vendor/installed.json play/tacticmesh/vendor/LICENSE challenge/index.html challenge/challenge.css challenge/leaderboard.js challenge/run-card.js challenge/slot-reels.js challenge/tiers.js challenge/match-report.js challenge/drag-drop.js challenge/performance.js challenge/item-optimizer.js challenge/special-items-data.js franchise/index.html franchise/career.js franchise/career.css franchise/hybrid-sim.js franchise/tm-engine-bridge.js franchise/tm-worker.js franchise/tactical-viewer.js franchise/tacticmesh/vendor/installed.json franchise/tacticmesh/vendor/LICENSE; do
            test -s "dist/$file"
          done
          test -s dist/.htaccess
          test -s dist/watch/soccerjs/watch-bridge.js
          test -s dist/watch/soccerjs/dist/index.html
          test -s dist/watch/soccerjs/dist/viewer.css
          test -s dist/watch/soccerjs/dist/viewer.bundle.js
          test -s dist/watch/soccerjs/dist/SOCCER-JS-LICENSE.txt
          test -s dist/watch/soccerjs/dist/assets/animation_rigs/1.json
          test ! -e dist/watch/soccerjs/dist/fixture.json
          grep -q "private, no-cache, max-age=0, must-revalidate" dist/.htaccess
          test ! -e dist/.git
          test ! -e dist/legacy-v05
          test ! -e dist/legacy-v07c
          test ! -e dist/career.js
          test ! -e dist/tacticmesh/vendor
          test ! -e dist/calibration
          test ! -e dist/tests
          echo "All five pages validated: Home, Ratings guide and three modes (Play, Challenges, Franchise)."

      - name: Check deployment credentials
        id: ftp
        shell: bash
        env:
          HOST: ${{ secrets.SG_FTP_HOST }}
          USERNAME: ${{ secrets.SG_FTP_USER }}
          PASSWORD: ${{ secrets.SG_FTP_PASSWORD }}
        run: |
          if [[ -n "$HOST" && -n "$USERNAME" && -n "$PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add SG_FTP_HOST, SG_FTP_USER and SG_FTP_PASSWORD as Actions secrets to enable SiteGround publishing."
          fi

      # FTP home must be the pfc subdomain folder, one level above public_html.
      # Publishing is restricted to public_html within that dedicated subdomain.
      # Explicit FTPS + certificate validation: never silently use plain FTP.
      - name: Deploy to pfc.cliffslunchclub.com
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SG_FTP_HOST }}
          username: ${{ secrets.SG_FTP_USER }}
          password: ${{ secrets.SG_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
          log-level: standard
