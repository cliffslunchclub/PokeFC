name: Deploy PokéFC Playtest to SiteGround

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "career.css"
      - "career.js"
      - "species.js"
      - "quick-sim.js"
      - "calibration-profile.js"
      - "hybrid-sim.js"
      - "tm-engine-bridge.js"
      - "tactical-viewer.js"
      - "tm-worker.js"
      - "challenge/**"
      - "legacy-v07c/**"
      - "tacticmesh/vendor/**"
      - "scripts/build-siteground.sh"
      - "tests/test-challenge-special-items.cjs"
      - "tests/test-v08-league.cjs"
      - "tests/test-hybrid.cjs"
      - ".github/workflows/deploy-siteground.yml"

permissions:
  contents: read

concurrency:
  group: pfc-siteground-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish pfc.cliffslunchclub.com
    runs-on: ubuntu-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v4

      - name: Test Challenge and Franchise gameplay
        run: |
          node tests/test-challenge-special-items.cjs
          node tests/test-v08-league.cjs
          node tests/test-hybrid.cjs

      - name: Build the public playtest
        run: bash scripts/build-siteground.sh

      - name: Validate public output
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html career.js career.css hybrid-sim.js tm-engine-bridge.js tm-worker.js tactical-viewer.js challenge/index.html challenge/special-items-data.js species.js quick-sim.js calibration-profile.js legacy-v07c/index.html legacy-v07c/career.js tacticmesh/vendor/installed.json legacy-v07c/tacticmesh/vendor/installed.json; do
            test -s "dist/$file"
          done
          test ! -e dist/.git
          test ! -e dist/legacy-v05
          test ! -e dist/calibration
          test ! -e dist/tests
          echo "Challenge-only build validated."

      - name: Check deployment credentials
        id: ftp
        shell: bash
        env:
          HOST: ${{ secrets.SG_FTP_HOST }}
          USERNAME: ${{ secrets.SG_FTP_USER }}
          PASSWORD: ${{ secrets.SG_FTP_PASSWORD }}
        run: |
          if [[ -n "$HOST" && -n "$USERNAME" && -n "$PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add SG_FTP_HOST, SG_FTP_USER and SG_FTP_PASSWORD as Actions secrets to enable SiteGround publishing."
          fi

      # FTP home must be the pfc subdomain folder, one level above public_html.
      # Publishing is restricted to public_html within that dedicated subdomain.
      # Explicit FTPS + certificate validation: never silently use plain FTP.
      - name: Deploy to pfc.cliffslunchclub.com
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SG_FTP_HOST }}
          username: ${{ secrets.SG_FTP_USER }}
          password: ${{ secrets.SG_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
          log-level: standard
