name: PokéFC Phase 10 — Soccer-JS overnight feasibility

on:
  push:
    branches:
      - experiment/phase10-soccerjs-overnight
    paths:
      - ".github/workflows/phase10-soccerjs-overnight.yml"
      - "scripts/phase10-soccerjs-overnight.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overnight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out private PokéFC experimental branch
        uses: actions/checkout@v4
      - name: Check out the exact publicly tested Soccer-JS version
        uses: actions/checkout@v4
        with:
          repository: haeretici/soccer-js
          ref: 38970e0dade0865078c9e84bc1ecfd72aaa02fde
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate PokéFC Quick Sim historical behavior
        run: |
          node tests/test-quick-seed-compat.cjs
          node tests/test-phase10-director.cjs
      - name: Validate existing Soccer-JS match mechanics and deterministic replay
        working-directory: upstream
        run: |
          set -euo pipefail
          node tests/match_fsm_gate.js
          node tests/match_rules_events.js
          node tests/replay_scrubber_test.js
          node tests/substitutions.js
          node tests/manual_control.js
          node tests/goal_entity.js
      - name: Run seeded 90-minute baseline, draw frequency and replay stability checks
        run: |
          node --check scripts/phase10-soccerjs-overnight.cjs
          node scripts/phase10-soccerjs-overnight.cjs upstream
      - name: Save overnight report even if a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokefc-phase10-soccerjs-overnight-report
          path: phase10-reports/
          if-no-files-found: warn
          retention-days: 30
