<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokéFC — Challenge Mode Alpha</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#071a1c;color:#e8f7f2}body{max-width:1120px;margin:auto;padding:22px}h1{margin-bottom:5px}p,.muted{color:#a4c2bd}button,select,input{font:inherit;padding:9px;border:1px solid #47746b;background:#153d39;color:white;border-radius:7px}button{cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.panel{background:#102d2d;border:1px solid #315650;padding:17px;border-radius:12px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.slot,.pick{padding:10px;border:1px solid #315650;border-radius:8px;margin:5px 0}.pick{display:flex;align-items:center;justify-content:space-between;gap:8px}.pick img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}.active{border-color:#8fe7b2;background:#1d5145}.good{color:#8fe7b2}.warning{color:#f5cb77}.scroll{max-height:360px;overflow:auto}small{color:#9bbab4}label{display:inline-block;margin:6px}button.primary{background:#286c50}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.site-nav{display:flex;gap:7px;flex-wrap:wrap}.site-nav a{border:1px solid #47746b;padding:9px 12px;border-radius:8px;text-decoration:none;color:#b5d6c6;font-weight:700;font-size:13px}.site-nav a.active,.site-nav a:hover{background:#276d54;color:white;border-color:#4d9675}a{color:#9fe1c0}
</style></head><body><header><div><h1>PokéFC · Challenges</h1><p>Draft → Equip → Lock · browser alpha</p></div><nav class="site-nav" aria-label="Main site navigation"><a href="../index.html">Home / Free Builder</a><a href="./" class="active" aria-current="page">Challenges</a><a href="../franchise/">Franchise · 32 Gyms</a></nav></header><main id="app"></main>
<script src="../species.js"></script><script src="../calibration-profile.js"></script><script src="../quick-sim.js"></script><script src="./special-items-data.js"></script><script>
(()=>{'use strict';
const KEY='pokefc-challenge-alpha-1',S=window.FXI_SPECIES||[],BY=new Map(S.map(s=>[s.id,s]));
const FORMS={'4-3-3':['GK','LB','CB','CB','RB','CM','CM','CM','LW','ST','RW'],'4-2-3-1':['GK','LB','CB','CB','RB','CDM','CDM','LW','CAM','RW','ST'],'4-4-2':['GK','LB','CB','CB','RB','LM','CM','CM','RM','ST','ST'],'3-5-2':['GK','CB','CB','CB','LWB','RWB','CM','CM','CAM','ST','ST'],'5-3-2':['GK','LWB','CB','CB','CB','RWB','CM','CM','CM','ST','ST']};
const ITEMS=[
['Leftovers',100,{hp:10}],['Muscle Band',100,{attack:10}],['Wise Glasses',100,{spAttack:10}],['Quick Claw',100,{speed:10}],['Hard Stone',100,{defense:10}],['Mental Herb',100,{spDefense:10}],['Silk Scarf',100,{attack:5,speed:5}],['Wide Lens',100,{spAttack:5,speed:5}],['Sitrus Berry',100,{hp:5,spDefense:5}],['Focus Band',100,{defense:5,spDefense:5}],
['Choice Scarf',200,{speed:20}],['Scope Lens',200,{attack:15,speed:5}],['Rocky Helmet',200,{defense:15,hp:5}],['Shell Bell',200,{hp:10,spDefense:10}],['Expert Belt',200,{attack:10,spAttack:10}],['Light Clay',200,{defense:10,spDefense:10}],['Zoom Lens',200,{spAttack:15,spDefense:5}],['Float Stone',200,{speed:15,hp:5}],['Safety Goggles',200,{spDefense:15,defense:5}],['Grip Claw',200,{attack:10,defense:10}],
['Choice Band',400,{attack:40}],['Choice Specs',400,{spAttack:40}],['Assault Vest',400,{defense:20,spDefense:15,hp:5}],['Life Orb',400,{attack:15,spAttack:15,speed:10}],['Iron Ball',400,{defense:30,attack:10}],['Power Anklet',400,{speed:30,hp:10}],['Power Lens',400,{spAttack:30,speed:10}],['Power Weight',400,{hp:30,defense:10}],['Power Band',400,{spDefense:30,defense:10}],['Weakness Policy',400,{attack:20,spAttack:20}]];
const SPECIAL=window.PFC_CHALLENGE_SPECIAL||{evolvable:[],megas:{}};
const EVOLVABLE=new Set(SPECIAL.evolvable);
const EVIOLITE=['Eviolite',700,{hp:20,attack:20,defense:20,spAttack:20,spDefense:20,speed:20}];
function megaForm(s,item){return s&&item?(SPECIAL.megas[s.id]||[]).find(m=>m.stone===item):null}
function itemFor(s,name){
 if(!s||!name)return null;
 if(name==='Eviolite')return EVOLVABLE.has(s.id)?EVIOLITE:null;
 if(megaForm(s,name))return [name,700,{}];
 return ITEMS.find(it=>it[0]===name)||null;
}
function effectiveStats(s,item){
 if(!s)return null;
 const mega=megaForm(s,item);
 if(mega)return {...mega.stats};
 const b={...s.baseStats},it=itemFor(s,item);
 if(it)for(const [k,v] of Object.entries(it[2]))b[k]+=v;
 return b;
}
function offeredItems(s){
 return [...ITEMS,...(EVOLVABLE.has(s.id)?[EVIOLITE]:[]),...(SPECIAL.megas[s.id]||[]).map(m=>[m.stone,700,{}])];
}
const gen=id=>id<=151?1:id<=251?2:id<=386?3:id<=493?4:id<=649?5:id<=721?6:id<=809?7:id<=905?8:9;
function seed(){return (crypto.getRandomValues(new Uint32Array(1))[0]||1)>>>0}
function next(){let x=st.rng>>>0;x^=x<<13;x^=x>>>17;x^=x<<5;st.rng=x>>>0;return st.rng/4294967296}
const initial=()=>({version:1,phase:'setup',pool:4,legends:false,formation:'4-3-3',tactic:'balanced',roster:Array(11).fill(null),items:Array(11).fill(null),roll:null,selected:0,rng:seed(),rerollType:1,rerollGen:1,moves:1,formationChanges:1,locked:null,result:null});
let st;try{st=JSON.parse(localStorage.getItem(KEY));if(st?.version!==1)st=initial()}catch{st=initial()}
const save=()=>localStorage.setItem(KEY,JSON.stringify(st));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pool=()=>S.filter(s=>gen(s.id)<=st.pool&& (st.legends||!s.legendary)&&!st.roster.includes(s.id));
const eligible=()=>st.roll?pool().filter(s=>s.types.includes(st.roll.type)&&gen(s.id)===st.roll.gen):[];
function rating(s,pos,item){if(!s)return 0;const b=effectiveStats(s,item);const w=pos==='GK'?{hp:.2,defense:.3,spDefense:.3,speed:.2}:['CB','LB','RB','LWB','RWB'].includes(pos)?{defense:.35,hp:.2,attack:.2,speed:.25}:['ST','LW','RW'].includes(pos)?{attack:.35,spAttack:.2,speed:.35,hp:.1}:{spAttack:.3,spDefense:.25,attack:.2,speed:.25};return Math.min(100,20+.55*Object.entries(w).reduce((v,[k,f])=>v+b[k]*f,0))}
const teamScore=()=>st.roster.reduce((a,id,i)=>a+rating(BY.get(id),FORMS[st.formation][i],st.items[i]),0)/11;
function roll(){const a=pool();if(!a.length){st.roll=null;return}const types=[...new Set(a.flatMap(s=>s.types))],valid=[];for(const type of types)for(let g=1;g<=st.pool;g++)if(a.some(s=>s.types.includes(type)&&gen(s.id)===g))valid.push({type,gen:g});st.roll=valid[Math.floor(next()*valid.length)]}
function reroll(which){if(which==='type'&&!st.rerollType||which==='gen'&&!st.rerollGen)return;const a=pool(),old=st.roll;if(!old)return;const opts=which==='type'?[...new Set(a.filter(s=>gen(s.id)===old.gen).flatMap(s=>s.types))].filter(x=>x!==old.type).map(type=>({type,gen:old.gen})):Array.from({length:st.pool},(_,i)=>i+1).filter(g=>g!==old.gen&&a.some(s=>gen(s.id)===g&&s.types.includes(old.type))).map(gen=>({type:old.type,gen}));if(!opts.length)return;st.roll=opts[Math.floor(next()*opts.length)];if(which==='type')st.rerollType--;else st.rerollGen--}
function render(){const app=document.getElementById('app');if(st.phase==='setup'){app.innerHTML='<section class="panel"><h2>New Challenge</h2><label>Pokédex <select id="pool"><option value="4">Classic · Gen I–IV</option><option value="9" disabled>National · Gen I–IX (data pending)</option></select></label><label>Legendaries <select id="leg"><option value="off">Off</option><option value="on">On (max 2)</option></select></label><label>Formation <select id="form">'+Object.keys(FORMS).map(f=>'<option>'+f+'</option>').join('')+'</select></label><button class="primary" id="start">Start draft</button><p class="warning">National Gen I–IX requires the expanded species dataset. This alpha uses the existing 493-species roster.</p></section>';document.getElementById('start').onclick=()=>{st.pool=4;st.legends=document.getElementById('leg').value==='on';st.formation=document.getElementById('form').value;st.phase='draft';roll();save();render()};return}
const slots=FORMS[st.formation],filled=st.roster.filter(Boolean).length,used=st.items.reduce((a,n,i)=>a+(itemFor(BY.get(st.roster[i]),n)?.[1]||0),0);
let body='<section class="panel"><h2>'+(st.phase==='locked'?'Final XI locked':st.phase==='shop'?'Equip your XI':'Draft your XI')+'</h2><p>'+filled+'/11 selected · Formation '+esc(st.formation)+' · Team Score '+(filled===11?teamScore().toFixed(2):'—')+'</p><div class="grid">';
body+=slots.map((pos,i)=>{const s=BY.get(st.roster[i]);return '<div class="slot '+(st.selected===i?'active':'')+'"><button data-slot="'+i+'" '+(st.phase==='locked'?'disabled':'')+'>'+pos+' · '+(s?esc(s.name):'Empty')+'</button>'+(s?'<small> '+rating(s,pos,st.items[i]).toFixed(1)+' OVR</small>':'')+(s&&st.phase!=='draft'?'<div><select data-item="'+i+'" '+(st.phase==='locked'?'disabled':'')+'><option value="">No item</option>'+offeredItems(s).map(it=>'<option value="'+esc(it[0])+'" '+(st.items[i]===it[0]?'selected':'')+'>'+esc(it[0])+' · ₽'+it[1]+(it[0]==='Eviolite'?' · +20 each base stat':megaForm(s,it[0])?' · Mega':'')+'</option>').join('')+'</select></div>':'')+'</div>'}).join('')+'</div></section>';
if(st.phase==='draft'){const opts=eligible().sort((a,b)=>rating(b,slots[st.selected])-rating(a,slots[st.selected]));body+='<section class="panel"><h2>Round '+(filled+1)+' · '+(st.roll?esc(st.roll.type)+' / Gen '+st.roll.gen:'—')+'</h2><p>Select an empty slot, then choose a Pokémon. Ranked by the selected position.</p><button id="typeR" '+(!st.rerollType?'disabled':'')+'>Type reroll ('+st.rerollType+')</button> <button id="genR" '+(!st.rerollGen?'disabled':'')+'>Generation reroll ('+st.rerollGen+')</button><div class="scroll">'+opts.map(s=>'<div class="pick"><img loading="lazy" alt="" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+s.id+'.png"><span>'+esc(s.name)+' <small>#'+s.id+' · '+rating(s,slots[st.selected]).toFixed(1)+' OVR</small></span><button data-pick="'+s.id+'" '+(st.roster[st.selected]?'disabled':'')+'>Draft</button></div>').join('')+'</div></section>'}
if(st.phase==='shop'){body+='<section class="panel"><h2>Item shop · ₽'+(1000-used)+' remaining</h2><p>Items are unique across your XI. Changes are fully refundable until lock. 30 standard items plus eligible ₽700 specials. Eviolite grants +20 to all six base stats to Pokémon that can evolve; a matching Mega Stone applies official Mega stats. Maximum one Mega per XI.</p><label>Tactics <select id="tactic">'+['balanced','attacking','defensive','press','counter','possession'].map(t=>'<option '+(st.tactic===t?'selected':'')+'>'+t+'</option>').join('')+'</select></label><button class="primary" id="lock">Lock Final XI</button></section>'}
if(st.phase==='locked')body+='<section class="panel"><h2>Round 1 · Lorelei</h2><p>5-3-2 Defensive · Unranked provisional Quick Sim.</p><button id="play" class="primary">Play Lorelei · Quick Sim</button></section>';if(st.phase==='result')body+='<section class="panel"><h2>Lorelei match result</h2><h1>'+st.result.score.join(' – ')+'</h1><p>'+esc(st.result.outcome)+'</p><p>Shots '+st.result.shots.join(' – ')+' · Passes '+st.result.passes.join(' – ')+'</p><p class="warning">Extra time and gauntlet progression are not implemented yet.</p></section>';
body+='<section class="panel"><button id="reset">Abandon local alpha run</button> <small>Autosaves to this browser. This is an unranked development prototype.</small></section>';app.innerHTML=body;
app.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{st.selected=+b.dataset.slot;save();render()});
app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(st.roster[st.selected])return;const s=BY.get(+b.dataset.pick);if(!eligible().some(x=>x.id===s.id))return;if(s.legendary&&st.roster.filter(id=>BY.get(id)?.legendary).length>=2)return;st.roster[st.selected]=s.id;if(st.roster.every(Boolean))st.phase='shop';else{st.selected=st.roster.findIndex(x=>!x);roll()}save();render()});
app.querySelectorAll('[data-item]').forEach(sel=>sel.onchange=()=>{const i=+sel.dataset.item,s=BY.get(st.roster[i]),name=sel.value,it=itemFor(s,name),prior=itemFor(s,st.items[i]);const anotherMega=st.items.some((x,j)=>j!==i&&megaForm(BY.get(st.roster[j]),x));if(name&&(!it||st.items.some((x,j)=>x===name&&j!==i)||used-(prior?.[1]||0)+it[1]>1000||(megaForm(s,name)&&anotherMega))){alert(!it?'Item unavailable for this Pokémon':megaForm(s,name)&&anotherMega?'Only one Mega Evolution is allowed per team.':'Item already used or over the ₽1,000 budget.');render();return}st.items[i]=name||null;save();render()});
if(st.phase==='draft'){document.getElementById('typeR').onclick=()=>{reroll('type');save();render()};document.getElementById('genR').onclick=()=>{reroll('gen');save();render()}}
if(st.phase==='shop'){document.getElementById('tactic').onchange=e=>{st.tactic=e.target.value;save()};document.getElementById('lock').onclick=()=>{if(st.roster.some(x=>!x)||used>1000)return;if(!confirm('Lock your XI, positions, tactics and items for the gauntlet?'))return;st.phase='locked';st.locked=JSON.parse(JSON.stringify({roster:st.roster,items:st.items,formation:st.formation,tactic:st.tactic,score:teamScore()}));save();render()}}
if(st.phase==='locked')document.getElementById('play').onclick=()=>{try{st.result=playLorelei();st.phase='result';save();render()}catch(e){alert('Quick Sim error: '+e.message)}};
document.getElementById('reset').onclick=()=>{if(confirm('Abandon this local Challenge run?')){st=initial();save();render()}}}
function playLorelei(){
if(!window.FXI_QUICK)throw Error('Quick Sim library unavailable');
const boss=[91,131,208,365,87,121,199,124,272,99,319],roles=['GK','DEF','DEF','DEF','DEF','DEF','MID','MID','MID','FWD','FWD'];
const build=(s,i,pos,prefix,item)=>{const b=effectiveStats(s,item);
const val=(w)=>Math.min(99,20+.55*Object.entries(w).reduce((a,[k,v])=>a+(b[k]||0)*v,0));
const speed=val({speed:.8,attack:.2}),attack=val({attack:.55,spAttack:.25,speed:.2}),defense=val({defense:.5,hp:.25,spDefense:.25}),passing=val({spAttack:.35,spDefense:.25,speed:.2,attack:.2});
return {id:prefix+i,name:s.name,pos,main:{sprintSpeed:speed,shortPassing:passing,firstTouch:passing,vision:passing,tackling:defense,finishing:attack},detail:{reflexes:defense,handling:defense,positioning:defense,diving:defense,kicking:passing,strength:defense,decisionMaking:passing,composure:attack}}};
const ours={id:'challenger',tactic:st.tactic==='high press'?'press':st.tactic,lineup:st.roster.map((id,i)=>{const pos=FORMS[st.formation][i];return build(BY.get(id),i,pos==='GK'?'GK':['LB','RB','CB','LWB','RWB'].includes(pos)?'DEF':['ST','LW','RW'].includes(pos)?'FWD':'MID','c',st.items[i])})};
const theirs={id:'lorelei',tactic:'defensive',lineup:boss.map((id,i)=>build(BY.get(id),i,roles[i],'l',null))};
const out=window.FXI_QUICK.simulate({home:ours,away:theirs,seed:'challenge:'+st.rng},{seed:'challenge:'+st.rng});
return {score:out.score,shots:out.stats.map(x=>x.shots),passes:out.stats.map(x=>x.passes),outcome:out.score[0]>out.score[1]?'Victory':out.score[0]<out.score[1]?'Defeat':'Draw — extra time pending',seed:st.rng};
}
save();render();
})();
</script></body></html>
