<div class="challenge-frame"><div class="challenge-heading"><span class="pfc-eyebrow">CLASSIC · NATIONAL · 6-BOSS GAUNTLET</span><h1>THE INDIGO CHALLENGE.</h1><p>Draft 11 Pokémon, manage a ₽1,000 item budget, then face Lorelei, Bruno, Agatha, Lance, Blue and Red. Lock your XI before entering the gauntlet.</p></div><main id="app"></main></div>
<script src="../national-species.js?v=1"></script><script src="../calibration-profile.js"></script><script src="../quick-sim.js"></script><script src="./special-items-data.js"></script><script src="../play/opponents.js"></script><script>

['Choice Band',400,{attack:40}],['Choice Specs',400,{spAttack:40}],['Assault Vest',400,{defense:20,spDefense:15,hp:5}],['Life Orb',400,{attack:15,spAttack:15,speed:10}],['Iron Ball',400,{defense:30,attack:10}],['Power Anklet',400,{speed:30,hp:10}],['Power Lens',400,{spAttack:30,speed:10}],['Power Weight',400,{hp:30,defense:10}],['Power Band',400,{spDefense:30,defense:10}],['Weakness Policy',400,{attack:20,spAttack:20}]];

let st;try{st=JSON.parse(localStorage.getItem(KEY));if(st?.version!==1)st=initial();else{st.round=Number.isInteger(st.round)?st.round:0;st.history=Array.isArray(st.history)?st.history:[]}}catch{st=initial()}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pool=()=>S.filter(s=>(s.gen||gen(s.id))<=st.pool&& (st.legends||!s.legendary)&&!st.roster.includes(s.id));

function rating(s,pos,item){if(!s)return 0;const b=effectiveStats(s,item);const w=pos==='GK'?{hp:.2,defense:.3,spDefense:.3,speed:.2}:['CB','LB','RB','LWB','RWB'].includes(pos)?{defense:.35,hp:.2,attack:.2,speed:.25}:['ST','LW','RW'].includes(pos)?{attack:.35,spAttack:.2,speed:.35,hp:.1}:{spAttack:.3,spDefense:.25,attack:.2,speed:.25};return Math.min(100,20+.55*Object.entries(w).reduce((v,[k,f])=>v+b[k]*f,0))}
const teamScore=()=>st.roster.reduce((a,id,i)=>a+rating(BY.get(id),FORMS[st.formation][i],st.items[i]),0)/11;
function roll(){const a=pool();if(!a.length){st.roll=null;return}const types=[...new Set(a.flatMap(s=>s.types))],valid=[];for(const type of types)for(let g=1;g<=st.pool;g++)if(a.some(s=>s.types.includes(type)&&(s.gen||gen(s.id))===g))valid.push({type,gen:g});st.roll=valid[Math.floor(next()*valid.length)]}
function reroll(which){if(which==='type'&&!st.rerollType||which==='gen'&&!st.rerollGen)return;const a=pool(),old=st.roll;if(!old)return;const opts=which==='type'?[...new Set(a.filter(s=>(s.gen||gen(s.id))===old.gen).flatMap(s=>s.types))].filter(x=>x!==old.type).map(type=>({type,gen:old.gen})):Array.from({length:st.pool},(_,i)=>i+1).filter(g=>g!==old.gen&&a.some(s=>gen(s.id)===g&&s.types.includes(old.type))).map(gen=>({type:old.type,gen}));if(!opts.length)return;st.roll=opts[Math.floor(next()*opts.length)];if(which==='type')st.rerollType--;else st.rerollGen--}
function render(){const app=document.getElementById('app');if(st.phase==='setup'){
 app.innerHTML='<section class="panel"><span class="pfc-eyebrow">NEW RUN</span><h2>Choose your Challenge</h2><div class="challenge-banner"><b>Four Challenge categories</b><p>Classic or National · Legendaries Off or On. Each category has its own local results. Online leaderboards are not enabled yet.</p></div>'+
 '<div class="controls-inline"><label>Pokédex pool <select id="pool"><option value="4">CLASSIC · Gen I–IV (493)</option><option value="9">NATIONAL · Gen I–IX (1,025)</option></select></label>'+
 '<label>Legendaries <select id="leg"><option value="off">OFF · No Legendary / Mythical / Ultra Beast</option><option value="on">ON · Up to 2 per XI</option></select></label>'+
 '<label>Starting formation <select id="form">'+Object.keys(FORMS).map(f=>'<option>'+f+'</option>').join('')+'</select></label></div>'+
 '<p class="statline">11 unique Pokémon · one type and generation reroll · one drafted-player move · one formation change · ₽1,000 item shop · one Mega maximum · all six opponents with your locked XI.</p>'+
 '<button class="primary" id="start">START CHALLENGE →</button></section>';
 document.getElementById('start').onclick=()=>{st.pool=+document.getElementById('pool').value;st.legends=document.getElementById('leg').value==='on';st.formation=document.getElementById('form').value;st.round=0;st.history=[];st.phase='draft';roll();save();render()};return}
const slots=FORMS[st.formation],filled=st.roster.filter(Boolean).length,used=st.items.reduce((a,n,i)=>a+(itemFor(BY.get(st.roster[i]),n)?.[1]||0),0);
let body='<section class="panel"><h2>'+(st.phase==='locked'?'Final XI locked':st.phase==='shop'?'Equip your XI':'Draft your XI')+'</h2><p>'+filled+'/11 selected · Formation '+esc(st.formation)+' · Team Score '+(filled===11?teamScore().toFixed(2):'—')+'</p><div class="grid">';
body+=slots.map((pos,i)=>{const s=BY.get(st.roster[i]);return '<div class="slot '+(st.selected===i?'active':'')+'"><button data-slot="'+i+'" '+(!['draft','shop'].includes(st.phase)?'disabled':'')+'>'+pos+' · '+(s?esc(s.name):'Empty')+'</button>'+(s?'<small> '+rating(s,pos,st.items[i]).toFixed(1)+' OVR</small>':'')+(s&&st.phase!=='draft'?'<div><select data-item="'+i+'" '+(st.phase!=='shop'?'disabled':'')+'><option value="">No item</option>'+offeredItems(s).map(it=>'<option value="'+esc(it[0])+'" '+(st.items[i]===it[0]?'selected':'')+'>'+esc(it[0])+' · ₽'+it[1]+(it[0]==='Eviolite'?' · +20 each base stat':megaForm(s,it[0])?' · Mega':'')+'</option>').join('')+'</select></div>':'')+'</div>'}).join('')+'</div></section>';
if(st.phase==='draft'){

 body+='<section class="panel"><span class="pfc-eyebrow">ROUND '+(filled+1)+' OF 11</span><h2>'+ (st.roll?esc(st.roll.type.toUpperCase())+' · GEN '+st.roll.gen:'NO ELIGIBLE ROLL')+'</h2><p>Select any empty slot, then draft a matching Pokémon. Position ratings are provisional. '+(st.legends?'Legendary / Mythical / Ultra Beast picks: '+legendaryCount+'/2.':'Legendary / Mythical / Ultra Beast picks excluded.')+'</p>'+
 '<div class="controls-inline"><button id="typeR" '+(!st.rerollType?'disabled':'')+'>REROLL TYPE · '+st.rerollType+'</button><button id="genR" '+(!st.rerollGen?'disabled':'')+'>REROLL GEN · '+st.rerollGen+'</button></div>'+

 if(st.moves>0&&st.phase==='draft'&&filled>0&&filled<11)body+='<div class="controls-inline"><label>Move drafted Pokémon <select id="moveFrom">'+st.roster.map((id,i)=>id?'<option value="'+i+'">'+slots[i]+' · '+esc(BY.get(id).name)+'</option>':'').join('')+'</select></label><label>To empty slot <select id="moveTo">'+st.roster.map((id,i)=>!id?'<option value="'+i+'">'+slots[i]+'</option>':'').join('')+'</select></label><button id="movePick">MOVE PICK · 1 LEFT</button></div>';

}
if(st.phase==='shop'){body+='<section class="panel"><h2>Item shop · ₽'+(1000-used)+' remaining</h2><p>Items are unique across your XI. Changes are fully refundable until lock. 30 standard items plus eligible ₽700 specials. Eviolite grants +20 to all six base stats to Pokémon that can evolve; a matching Mega Stone applies official Mega stats. Maximum one Mega per XI.</p><label>Tactics <select id="tactic">'+['balanced','attacking','defensive','press','counter','possession'].map(t=>'<option '+(st.tactic===t?'selected':'')+'>'+t+'</option>').join('')+'</select></label><button class="primary" id="lock">Lock Final XI</button></section>'}
if(st.phase==='locked'){

}
if(st.phase==='result'||st.phase==='finished'){

 body+='<section class="panel"><span class="pfc-eyebrow">'+(st.phase==='finished'?'GAUNTLET COMPLETE':'MATCH '+(st.round+1)+' / 6')+'</span><h2>'+esc(st.result?.boss||'Opponent')+' · '+esc(st.result?.outcome||'Result')+'</h2><h1>'+ (st.result?.score||[0,0]).join(' – ')+'</h1><p>Shots '+(st.result?.shots||[]).join(' – ')+' · Passes '+(st.result?.passes||[]).join(' – ')+'</p>'+(st.result?.tiebreak?'<p class="warning">'+esc(st.result.tiebreak)+'</p>':'')+
 '<p class="statline">'+st.history.map((h,i)=>'Match '+(i+1)+': '+esc(h.boss)+' '+h.score.join('-')+' ('+esc(h.outcome)+')').join(' · ')+'</p>'+
 (st.phase==='result'&&win?'<button id="next" class="primary">ADVANCE TO '+esc((BOSSES[st.round+1]?.leader||'NEXT').toUpperCase())+' →</button>':st.phase==='finished'&&win?'<h2>🏆 CHALLENGE CHAMPION</h2><p>All six bosses defeated with the same Final XI.</p>':'<p class="warning">This attempt has ended. Start a new draft for another try.</p>')+'</section>';
}
body+='<section class="panel"><button id="reset">Abandon local alpha run</button> <small>Autosaves to this browser. This is an unranked development prototype.</small></section>';app.innerHTML=body;
app.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{st.selected=+b.dataset.slot;save();render()});
app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(st.roster[st.selected])return;const s=BY.get(+b.dataset.pick);if(!eligible().some(x=>x.id===s.id))return;if(s.legendary&&st.roster.filter(id=>BY.get(id)?.legendary).length>=2)return;st.roster[st.selected]=s.id;if(st.roster.every(Boolean))st.phase='shop';else{st.selected=st.roster.findIndex(x=>!x);roll()}save();render()});
app.querySelectorAll('[data-item]').forEach(sel=>sel.onchange=()=>{const i=+sel.dataset.item,s=BY.get(st.roster[i]),name=sel.value,it=itemFor(s,name),prior=itemFor(s,st.items[i]);const anotherMega=st.items.some((x,j)=>j!==i&&megaForm(BY.get(st.roster[j]),x));if(name&&(!it||st.items.some((x,j)=>x===name&&j!==i)||used-(prior?.[1]||0)+it[1]>1000||(megaForm(s,name)&&anotherMega))){alert(!it?'Item unavailable for this Pokémon':megaForm(s,name)&&anotherMega?'Only one Mega Evolution is allowed per team.':'Item already used or over the ₽1,000 budget.');render();return}st.items[i]=name||null;save();render()});
if(st.phase==='draft'){document.getElementById('typeR').onclick=()=>{reroll('type');save();render()};document.getElementById('genR').onclick=()=>{reroll('gen');save();render()}}

 st.result=playBoss();st.history.push({...st.result});
 st.phase=st.result.outcome!=='Victory'||st.round===5?'finished':'result';

}catch(e){alert('Quick Sim error: '+e.message)}};

function savePersonalRecord(){
 const cat=(st.pool===4?'classic':'national')+'-'+(st.legends?'legends':'standard');
 const key='pokefc-challenge-personal-records-v1';
 let records={};try{records=JSON.parse(localStorage.getItem(key))||{}}catch{}
 const old=records[cat]||{attempts:0,best:0,champions:0};
 records[cat]={attempts:old.attempts+1,best:Math.max(old.best,st.history.length),champions:old.champions+(st.history.length===6&&st.result?.outcome==='Victory'?1:0)};
 try{localStorage.setItem(key,JSON.stringify(records))}catch{}
}
function playBoss(){
 if(!window.FXI_QUICK)throw Error('Quick Sim library unavailable');
 const boss=BOSSES[st.round];if(!boss||!Array.isArray(boss.roster)||boss.roster.length!==11)throw Error('Boss roster unavailable');

 const build=(s,i,pos,prefix,item)=>{
  const b=effectiveStats(s,item);
  if(item==='Light Ball'&&s.id===25){b.attack*=2;b.spAttack*=2}
  const val=w=>Math.min(99,20+.55*Object.entries(w).reduce((a,[k,v])=>a+(b[k]||0)*v,0));
  const speed=val({speed:.8,attack:.2}),attack=val({attack:.55,spAttack:.25,speed:.2}),defense=val({defense:.5,hp:.25,spDefense:.25}),passing=val({spAttack:.35,spDefense:.25,speed:.2,attack:.2});
  return {id:prefix+i+'-'+s.id,name:s.name,pos,main:{sprintSpeed:speed,shortPassing:passing,firstTouch:passing,vision:passing,tackling:defense,finishing:attack},detail:{reflexes:defense,handling:defense,positioning:defense,diving:defense,kicking:passing,strength:defense,decisionMaking:passing,composure:attack}};
 };
 const ours={id:'challenger',tactic:st.tactic,lineup:st.roster.map((id,i)=>build(BY.get(id),i,role(FORMS[st.formation][i]),'c',st.items[i]))};
 const bossFormation=boss.formation||'4-3-3';
 const theirs={id:boss.key,tactic:boss.tactic||'balanced',lineup:boss.roster.map((id,i)=>{
  const s=BY.get(id);let item=null;
  if(boss.leader==='Blue'&&id===18)item='Pidgeotite';
  if(boss.leader==='Red'&&id===6)item='Charizardite X';
  if(boss.leader==='Red'&&id===25)item='Light Ball';
  return build(s,i,role(FORMS[bossFormation][i]),'boss',item);
 })};
 const seed='challenge:'+st.rng+':'+st.round;
 const out=window.FXI_QUICK.simulate({home:ours,away:theirs,seed},{seed});
 let outcome=out.score[0]>out.score[1]?'Victory':out.score[0]<out.score[1]?'Defeat':'Draw',tiebreak=null;
 if(outcome==='Draw'){
  // Provisional regulation draw resolver: deterministic penalty shootout.
  // Full TacticMesh extra time / penalty physics remains on the roadmap.
  const random=window.FXI_QUICK.randomizer(seed+':penalties');
  let a=3+Math.floor(random()*3),b=3+Math.floor(random()*3);
  if(a===b){if(random()<.5)a++;else b++}
  outcome=a>b?'Victory':'Defeat';tiebreak='Penalty shootout '+a+'–'+b+' · provisional draw resolver (full extra-time engine pending)';
 }
 return {boss:boss.leader,round:st.round+1,score:out.score,shots:out.stats.map(x=>x.shots),passes:out.stats.map(x=>x.passes),outcome,tiebreak,seed,origin:'quick-sim'};
}
save();render();
})();
</script></body></html>
